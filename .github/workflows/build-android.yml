# Сборка Android-клиента JTEK-Remote.
#
# Почему отдельный workflow, а не общий flutter-build.yml:
#   1) flutter-build.yml собирает всё сразу — Windows, macOS, Linux, Android.
#      Это часы работы, и падение любой платформы роняет весь прогон.
#   2) Он вызывается только через workflow_call из ci/nightly, которые
#      запускаются сами (push, schedule). Именно само-запуски и привели к
#      тому, что GitHub приостановил Actions в форке: «Workflows are not
#      currently being run on this fork due to the scale of GitHub Actions
#      usage». Здесь запуск ТОЛЬКО вручную — лимит не расходуется зря.
#
# APK подписывается debug-ключом (шаг Build rustdesk подменяет
# signingConfigs.release на signingConfigs.debug). Для личной установки
# этого достаточно: Android принимает такой APK без дополнительных действий.
#
# Сборка идёт отдельно по каждой архитектуре: arm64-v8a — почти все
# современные телефоны, armeabi-v7a — старые, x86_64 — эмуляторы.

name: Build JTEK-Remote for Android

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Какие архитектуры собирать"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - all

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  NDK_VERSION: "r28c"
  VERSION: "1.5.1"
  TAG_NAME: "jtek-android"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # ---------------------------------------------------------------------------
  # Мост Flutter <-> Rust. Нужен обязательно: без него не соберётся lib.
  # Генерируем только вариант для Flutter 3.22.3 — Android использует его.
  # ---------------------------------------------------------------------------
  generate-bridge:
    name: generate bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-android

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # extended_text 14 требует Dart новее, чем во Flutter 3.22.3
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # ---------------------------------------------------------------------------
  # Сборка APK
  # ---------------------------------------------------------------------------
  build-android:
    needs: [generate-bridge]
    name: apk ${{ matrix.job.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # arm64-v8a — почти все современные телефоны, поэтому он собирается
        # по умолчанию. Остальные архитектуры — только по выбору «all».
        job: >-
          ${{ inputs.arch == 'all'
              && fromJSON('[{"arch":"arm64","target":"aarch64-linux-android"},{"arch":"armv7","target":"armv7-linux-androideabi"},{"arch":"x86_64","target":"x86_64-linux-android"}]')
              || fromJSON('[{"arch":"arm64","target":"aarch64-linux-android"}]') }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Export cache environment for vcpkg
        # Нужно для двоичного кэша vcpkg (VCPKG_BINARY_SOURCES=x-gha):
        # без этих переменных зависимости собираются из исходников и это
        # занимает в разы больше времени.
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc-multilib git g++ g++-multilib \
            libc6-dev libclang-dev libunwind-dev llvm-dev nasm \
            ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          case ${{ matrix.job.target }} in
            aarch64-linux-android)   ANDROID_TARGET=arm64-v8a ;;
            armv7-linux-androideabi) ANDROID_TARGET=armeabi-v7a ;;
            x86_64-linux-android)    ANDROID_TARGET=x86_64 ;;
          esac
          if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do
              echo "$f:"; echo "======"; cat "$f"; echo "======"
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              ./flutter/ndk_arm64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
            ;;
            armv7-linux-androideabi)
              ./flutter/ndk_arm.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
            ;;
            x86_64-linux-android)
              ./flutter/ndk_x64.sh
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
            ;;
          esac

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Подпись debug-ключом: для личной установки этого достаточно,
          # Android принимает такой APK без дополнительных действий.
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          case ${{ matrix.job.target }} in
            aarch64-linux-android)
              mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
              pushd flutter
              flutter build apk "--release" --target-platform android-arm64 --split-per-abi
              mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../jtek-remote-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
            ;;
            armv7-linux-androideabi)
              mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
              pushd flutter
              flutter build apk "--release" --target-platform android-arm --split-per-abi
              mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../jtek-remote-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
            ;;
            x86_64-linux-android)
              mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
              cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/
              cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
              pushd flutter
              flutter build apk "--release" --target-platform android-x64 --split-per-abi
              mv build/app/outputs/flutter-apk/app-x86_64-release.apk ../jtek-remote-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
            ;;
          esac
          popd
          mkdir -p apk-out
          mv jtek-remote-${{ env.VERSION }}-${{ matrix.job.arch }}.apk apk-out/

      # Проверяем то, что реально увидит пользователь: имя, иконку, сервер.
      - name: Verify APK contents
        shell: bash
        run: |
          APK=apk-out/jtek-remote-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
          echo "=== файл ==="
          ls -lh "$APK"
          echo "=== имя приложения и пакет (aapt) ==="
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          AAPT=/usr/local/lib/android/sdk/build-tools/$BT/aapt2
          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "package:|application-label:|native-code" || true
          fi
          echo "=== наши ресурсы внутри APK ==="
          unzip -l "$APK" | grep -E "ic_launcher|lib/arm|lib/x86" | head -20
          echo "=== сервер в нативной библиотеке ==="
          mkdir -p /tmp/apkx && cd /tmp/apkx && rm -rf * && unzip -o -q "${{ github.workspace }}/$APK" "lib/*" || true
          for so in $(find . -name "librustdesk.so"); do
            echo "--- $so ---"
            strings "$so" | grep -c "185.26.121.69" || echo "0 вхождений сервера!"
            strings "$so" | grep -c "JTEK-Rem" || echo "0 вхождений имени!"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jtek-remote-apk-${{ matrix.job.arch }}
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "JTEK-Remote для Android"
          body: |
            Android-клиент JTEK-Remote, собранный из исходников.

            Подписан debug-ключом — устанавливается на телефон напрямую.
            Сервер и ключ зашиты в приложение.
          files: apk-out/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
